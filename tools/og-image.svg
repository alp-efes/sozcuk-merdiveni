<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <!-- Sosyal paylaşım kartı (1200x630). WhatsApp/Twitter/Facebook önizlemesi.
       Başvuru çizimidir; og-image.png dosyasını tools/ikon_uret.py üretir
       (başlığı Young Serif ile yazar). Renkler style.css :root belirteçlerinin
       kopyasıdır; tools/test_veri.py eşleşmeyi denetler. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e6"/>
      <stop offset="1" stop-color="#f3eada"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#a8432b"/>

  <!-- Sol metin bloğu -->
  <text x="90" y="235" fill="#a8432b" font-size="34" font-weight="700" letter-spacing="7">SÖZCÜK YOLU</text>
  <text x="88" y="325" fill="#2a2018" font-size="84" font-weight="400" font-family="Young Serif, Georgia, serif">Sözcük Merdiveni</text>
  <text x="90" y="405" fill="#2a2018" font-size="40" font-weight="500">Türkçe kelime oyunu · Her gün yeni bulmaca</text>
  <text x="90" y="458" fill="#6a5846" font-size="30" font-weight="500">Ücretsiz · Üyeliksiz · Mobil uyumlu</text>
  <text x="90" y="565" fill="#a8432b" font-size="34" font-weight="700">sözcükyolu.com</text>

  <!-- Sağ: merdiven ve bloklar (favicon ile aynı motif; 320 birim → 280) -->
  <g transform="translate(880,165) scale(0.875)">
    <g fill="#d9b07a">
      <rect x="52" y="51"  width="216" height="18" rx="5"/>
      <rect x="52" y="151" width="216" height="18" rx="5"/>
      <rect x="52" y="251" width="216" height="18" rx="5"/>
    </g>
    <rect x="40"  y="0" width="22" height="320" rx="9" fill="#b98a52"/>
    <rect x="46"  y="4" width="8"  height="312" rx="4" fill="#d9b07a"/>
    <rect x="258" y="0" width="22" height="320" rx="9" fill="#b98a52"/>
    <rect x="264" y="4" width="8"  height="312" rx="4" fill="#d9b07a"/>
    <rect x="72"  y="26"  width="84" height="84" rx="16" fill="#b98f56"/>
    <rect x="72"  y="18"  width="84" height="84" rx="16" fill="#ebd3a6"/>
    <rect x="118" y="126" width="84" height="84" rx="16" fill="#1e4a2a"/>
    <rect x="118" y="118" width="84" height="84" rx="16" fill="#2f6b3f"/>
    <rect x="164" y="226" width="84" height="84" rx="16" fill="#74291a"/>
    <rect x="164" y="218" width="84" height="84" rx="16" fill="#a8432b"/>
  </g>
</svg>
